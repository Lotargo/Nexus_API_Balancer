name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The existing repository is not globally rustfmt-clean yet. Keep CI focused
      # on compile/test correctness so this feature does not force a repository-wide
      # formatting rewrite.
      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets
